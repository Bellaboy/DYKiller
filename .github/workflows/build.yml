name: build DYKiller packages
run-name: DYKiller build · ${{ inputs.change_summary || 'manual build' }}

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Makefile'
      - 'control'
      - 'DYKiller.plist'
      - '.github/**'
  workflow_dispatch:
    inputs:
      change_summary:
        description: '本轮修改摘要（显示在 Action 事件标题）'
        required: true
        default: '未填写修改摘要'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    # Pinned on purpose: the glass tab bar needs an iOS 26 SDK, and the macos-latest label
    # migrates gradually — falling back to macOS 15 breaks the build on undeclared symbols.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve DYKiller version
        id: package
        run: |
          version=$(awk -F': *' '$1 == "Version" { print $2; exit }' control)
          if [ -z "$version" ]; then
            echo "Unable to read Version from control" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve Theos cache key
        run: |
          theos_head=$(git ls-remote https://github.com/roothide/theos HEAD | cut -f 1)
          sdks_head=$(git ls-remote https://github.com/theos/sdks HEAD | cut -f 1)
          echo "THEOS_CACHE_KEY=${{ runner.os }}-${theos_head}-${sdks_head}" >> "$GITHUB_ENV"

      - name: Cache DYKiller Theos toolchain
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ env.THEOS_CACHE_KEY }}

      - name: Setup DYKiller Theos toolchain
        run: bash .github/scripts/setup-theos.sh

      - name: Build DYKiller release assets
        run: bash .github/scripts/build-packages.sh

      - name: Verify DYKiller release assets
        run: bash .github/scripts/verify-assets.sh

      - name: Stamp assets with Action run number
        env:
          ACTION_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          for file in packages/*.deb packages/*.dylib; do
            [ -f "$file" ] || continue
            case "$file" in
              *.deb) output="${file%.deb}-action${ACTION_NUMBER}.deb" ;;
              *.dylib) output="${file%.dylib}-action${ACTION_NUMBER}.dylib" ;;
              *) continue ;;
            esac
            mv "$file" "$output"
          done

      - name: Upload DYKiller artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DYKiller-${{ steps.package.outputs.version }}-${{ github.run_number }}
          path: |
            packages/*.deb
            packages/*.dylib
